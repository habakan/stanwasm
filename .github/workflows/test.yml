name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test (native, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release

  msrv:
    name: cargo test (MSRV 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keeps `rust-version` in the workspace Cargo.toml honest — nuts-rs 0.18
      # needs edition 2024 + let-chains, so anything below this does not build.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm-build:
    name: wasm32 build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown -p stan-wasm-api --release
      - name: artifact size
        run: ls -la target/wasm32-unknown-unknown/release/stan_wasm_api.wasm

  wasm-pack:
    name: wasm-pack build + Node smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned rather than `latest` so a wasm-pack release can't change
          # what CI actually verified.
          version: 'v0.13.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: build wasm bundle
        run: ./scripts/build-wasm.sh
      - name: run Node smoke test
        run: cd ts && node --experimental-strip-types tests/smoke.ts

  no-wasm-gc:
    name: confirm no wasm-gc opcodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown -p stan-wasm-api --release
      - run: cargo test -p stan-codegen --test no_wasm_gc
