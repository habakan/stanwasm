[package]
name = "stan-wasm-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stan-ast.workspace = true
stan-parser.workspace = true
stan-runtime = { workspace = true, features = ["json"] }
stan-codegen.workspace = true
# stan-runtime exposes the AST evaluator. We use it to build the recorded tape;
# the evaluator code itself does not get reached after Compiled::from returns,
# so dead-code elimination keeps it out of the wasm binary.

wasm-bindgen.workspace = true
nuts-rs = { workspace = true }
rand = { workspace = true }
thiserror.workspace = true
anyhow.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasmparser = "0.220"
