[package]
name = "stanwasm-ast"
description = "Shared AST types for the Stan probabilistic programming language. Internal to stanwasm; no API stability guarantee."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["stan", "ast", "bayesian", "probabilistic", "wasm"]
categories = ["science", "data-structures"]

[dependencies]
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]
