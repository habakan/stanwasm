[package]
name = "stan-runtime"
description = "Stan distributions, constraint transforms, and AST evaluator — the native golden-oracle behind stanwasm."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["stan", "bayesian", "distributions", "mcmc", "statistics"]
categories = ["science", "mathematics"]

[dependencies]
stan-ast.workspace = true
stan-autodiff.workspace = true
stan-parser.workspace = true
thiserror.workspace = true
serde_json = { workspace = true, optional = true }
rand.workspace = true
rand_distr = "0.6"

[features]
default = ["json"]
json = ["dep:serde_json"]
