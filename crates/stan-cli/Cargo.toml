[package]
name = "stan-cli"
description = "Local development CLI for stanwasm: golden-value tests and benchmarks. Not published."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "stan-cli"
path = "src/main.rs"

[dependencies]
stan-parser.workspace = true
stan-autodiff.workspace = true
stan-runtime = { workspace = true, features = ["json"] }
stan-codegen.workspace = true
stan-wasm-api.workspace = true
anyhow.workspace = true
wasmi = "0.32"
