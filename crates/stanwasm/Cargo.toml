[package]
name = "stanwasm"
description = "Compile and sample models written in a subset of the Stan language, entirely in the browser. An independent implementation embedding nuts-rs; shares no code with Stan."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["stan", "wasm", "bayesian", "mcmc", "nuts"]
categories = ["wasm", "science", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["stan"]
# The Stan front end: parser, evaluator, constraint transforms, and the
# `StanModel` API over them. Without it only `AotSampler` is left, which reads a
# module someone compiled earlier and needs none of that in the bundle.
stan = [
    "dep:stanwasm-ast",
    "dep:stanwasm-parser",
    "dep:stanwasm-runtime",
    "dep:stanwasm-codegen",
]

[dependencies]
stanwasm-ast = { workspace = true, optional = true }
stanwasm-parser = { workspace = true, optional = true }
stanwasm-runtime = { workspace = true, features = ["json"], optional = true }
stanwasm-codegen = { workspace = true, optional = true }
# stanwasm-runtime exposes the AST evaluator. We use it to build the recorded tape;
# the evaluator code itself does not get reached after Compiled::from returns,
# so dead-code elimination keeps it out of the wasm binary.

wasm-bindgen.workspace = true
nuts-rs = { workspace = true }
rand = { workspace = true }
thiserror.workspace = true
anyhow.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasmparser = "0.258"
