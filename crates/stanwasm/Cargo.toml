[package]
name = "stanwasm"
description = "wasm-bindgen API for compiling and sampling Stan models entirely in the browser, embedding nuts-rs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["stan", "wasm", "bayesian", "mcmc", "nuts"]
categories = ["wasm", "science", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stanwasm-ast.workspace = true
stanwasm-parser.workspace = true
stanwasm-runtime = { workspace = true, features = ["json"] }
stanwasm-codegen.workspace = true
# stanwasm-runtime exposes the AST evaluator. We use it to build the recorded tape;
# the evaluator code itself does not get reached after Compiled::from returns,
# so dead-code elimination keeps it out of the wasm binary.

wasm-bindgen.workspace = true
nuts-rs = { workspace = true }
rand = { workspace = true }
thiserror.workspace = true
anyhow.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasmparser = "0.257"
