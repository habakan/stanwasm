[package]
name = "stanwasm-codegen"
description = "Traces a Stan model onto the autodiff tape that tapewasm-codegen emits as wasm. Internal to stanwasm; no API stability guarantee."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["stan", "wasm", "webassembly", "codegen", "compiler"]
categories = ["wasm", "compilers", "science"]

[dependencies]
stanwasm-runtime.workspace = true
tapewasm-autodiff.workspace = true
tapewasm-codegen.workspace = true
thiserror.workspace = true

[dev-dependencies]
# `ceiling_probe` writes wasm by hand to measure a design the emitter does not
# have yet, so it needs the encoder the emitter uses.
wasm-encoder.workspace = true
wasmparser = "0.258"
wasmi = { version = "1.1", features = ["simd"] }
