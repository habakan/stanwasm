[workspace]
resolver = "2"
members = [
    "crates/stan-ast",
    "crates/stan-parser",
    "crates/stan-autodiff",
    "crates/stan-runtime",
    "crates/stan-codegen",
    "crates/stan-wasm-api",
    "crates/stan-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/habakan/stan-wasm-rs"

[workspace.dependencies]
stan-ast = { path = "crates/stan-ast" }
stan-parser = { path = "crates/stan-parser" }
stan-autodiff = { path = "crates/stan-autodiff" }
stan-runtime = { path = "crates/stan-runtime" }
stan-codegen = { path = "crates/stan-codegen" }

nuts-rs = { version = "0.18.1", default-features = false }
wasm-bindgen = "0.2"
wasm-encoder = "0.220"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rand = { version = "0.10", features = ["chacha"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package."stan-wasm-api"]
opt-level = "z"
