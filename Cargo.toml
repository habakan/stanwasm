[workspace]
resolver = "2"
members = [
    "crates/stanwasm-ast",
    "crates/stanwasm-parser",
    "crates/stanwasm-runtime",
    "crates/stanwasm-codegen",
    "crates/stanwasm",
    "crates/stanwasm-cli",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
# Floor set by nuts-rs 0.18 (edition 2024 + let-chains). Verified with
# `cargo +1.88 test --workspace`.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/habakan/stanwasm"

[workspace.dependencies]
# Each internal dep carries `path` (what local builds resolve) and `version` (what
# `cargo publish` rewrites to). Bumping means these lines plus workspace.package.
stanwasm-ast = { path = "crates/stanwasm-ast", version = "0.6.0" }
stanwasm-parser = { path = "crates/stanwasm-parser", version = "0.6.0" }
stanwasm-runtime = { path = "crates/stanwasm-runtime", version = "0.6.0" }
stanwasm-codegen = { path = "crates/stanwasm-codegen", version = "0.6.0" }
stanwasm = { path = "crates/stanwasm", version = "0.6.0" }

# The engine: the tape, its emitter, and the wasm-bindgen API over both. Split
# out because nothing in it is about the Stan language. Pinned by rev until it
# reaches crates.io, which waits on the same nuts-rs release this crate does.
tapewasm-autodiff = { git = "https://github.com/habakan/tapewasm", rev = "44c96a9f089a9cc5d64b6549e46a02c90f5af5e6" }
tapewasm-codegen = { git = "https://github.com/habakan/tapewasm", rev = "44c96a9f089a9cc5d64b6549e46a02c90f5af5e6" }
tapewasm = { git = "https://github.com/habakan/tapewasm", rev = "44c96a9f089a9cc5d64b6549e46a02c90f5af5e6" }

nuts-rs = { version = "0.18.1", default-features = false }
wasm-bindgen = "0.2"
wasm-encoder = "0.258"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rand = { version = "0.10", features = ["chacha"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package."stanwasm"]
opt-level = "z"

# The engine ends up in the same bundle, so it wants the same trade.
[profile.release.package."tapewasm"]
opt-level = "z"

# nuts-rs pulled pulp's relaxed-simd, which WebKit rejects — see README. #76 fixed it
# upstream; this points at that commit until it reaches crates.io, then drop the block.
[patch.crates-io]
nuts-rs = { git = "https://github.com/pymc-devs/nuts-rs", rev = "fa647966938ce4116fb4ced8584229e654ca9035" }
