[workspace]
resolver = "2"
members = [
    "crates/stan-ast",
    "crates/stan-parser",
    "crates/stan-autodiff",
    "crates/stan-runtime",
    "crates/stan-codegen",
    "crates/stan-wasm-api",
    "crates/stan-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Floor set by nuts-rs 0.18 (edition 2024 + let-chains). Verified with
# `cargo +1.88 test --workspace`.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/habakan/stanwasm"

[workspace.dependencies]
# Each internal dependency carries both `path` and `version`. The path is what
# every local build resolves; the version is what `cargo publish` rewrites the
# dependency to on crates.io, and cargo refuses to package a crate whose
# dependency has no version requirement. `version.workspace` is not accepted
# inside `[workspace.dependencies]`, so a bump means editing these six lines
# alongside `workspace.package.version`.
#
# First publish has to go in dependency order, since each crate resolves the
# previous one from the registry:
#   stan-ast -> stan-autodiff -> stan-parser -> stan-runtime
#     -> stan-codegen -> stan-wasm-api
stan-ast = { path = "crates/stan-ast", version = "0.1.0" }
stan-parser = { path = "crates/stan-parser", version = "0.1.0" }
stan-autodiff = { path = "crates/stan-autodiff", version = "0.1.0" }
stan-runtime = { path = "crates/stan-runtime", version = "0.1.0" }
stan-codegen = { path = "crates/stan-codegen", version = "0.1.0" }
stan-wasm-api = { path = "crates/stan-wasm-api", version = "0.1.0" }

nuts-rs = { version = "0.18.1", default-features = false }
wasm-bindgen = "0.2"
wasm-encoder = "0.220"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rand = { version = "0.10", features = ["chacha"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package."stan-wasm-api"]
opt-level = "z"
