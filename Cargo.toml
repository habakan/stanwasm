[workspace]
resolver = "2"
members = [
    "crates/stanwasm-ast",
    "crates/stanwasm-parser",
    "crates/stanwasm-autodiff",
    "crates/stanwasm-runtime",
    "crates/stanwasm-codegen",
    "crates/stanwasm",
    "crates/stanwasm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Floor set by nuts-rs 0.18 (edition 2024 + let-chains). Verified with
# `cargo +1.88 test --workspace`.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/habakan/stanwasm"

[workspace.dependencies]
# Each internal dependency carries both `path` and `version`. The path is what
# every local build resolves; the version is what `cargo publish` rewrites the
# dependency to on crates.io, and cargo refuses to package a crate whose
# dependency has no version requirement. `version.workspace` is not accepted
# inside `[workspace.dependencies]`, so a bump means editing these six lines
# alongside `workspace.package.version`.
#
# Every published name is prefixed `stanwasm`, matching the npm package —
# never a bare `stan-*`, which on a flat registry namespace would read as a
# crate belonging to Stan itself.
#
# First publish has to go in dependency order, since each crate resolves the
# previous one from the registry:
#   stanwasm-ast -> stanwasm-autodiff -> stanwasm-parser -> stanwasm-runtime
#     -> stanwasm-codegen -> stanwasm
stanwasm-ast = { path = "crates/stanwasm-ast", version = "0.1.0" }
stanwasm-parser = { path = "crates/stanwasm-parser", version = "0.1.0" }
stanwasm-autodiff = { path = "crates/stanwasm-autodiff", version = "0.1.0" }
stanwasm-runtime = { path = "crates/stanwasm-runtime", version = "0.1.0" }
stanwasm-codegen = { path = "crates/stanwasm-codegen", version = "0.1.0" }
stanwasm = { path = "crates/stanwasm", version = "0.1.0" }

nuts-rs = { version = "0.18.1", default-features = false }
wasm-bindgen = "0.2"
wasm-encoder = "0.258"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rand = { version = "0.10", features = ["chacha"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package."stanwasm"]
opt-level = "z"

# nuts-rs is the last crate pulling pulp's relaxed-simd, which WebKit rejects at
# validation — without this, Safari and iOS cannot instantiate the bundle at all.
# Workspace builds only: a published crate does not carry [patch]. See README.
# Drop once pymc-devs/nuts-rs#76 is released.
[patch.crates-io]
nuts-rs = { git = "https://github.com/habakan/nuts-rs", rev = "61f261b26815be8cb21d5eef0840ba9f869d3af4" }
